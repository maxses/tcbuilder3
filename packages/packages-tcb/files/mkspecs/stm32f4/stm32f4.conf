#-----------------------------------------------------------------------------
#
# qmake configuration for building with arm-none-eabi-g++
#
#-----------------------------------------------------------------------------


MAKEFILE_GENERATOR      = UNIX
TARGET_PLATFORM         =
TEMPLATE                = app
CONFIG                  += warn_on release incremental
QMAKE_INCREMENTAL_STYLE = sublib
QT_ARCH			= arm-none-eabi
TOOL_CHAIN		= arm-none-eabi
QMAKE_COMPILER		= gcc

include(linux.conf)

# modifications to g++.conf
QMAKE_CC                = $${TOOL_CHAIN}-gcc
QMAKE_CXX               = $${TOOL_CHAIN}-gcc
QMAKE_LINK              = $${TOOL_CHAIN}-gcc
QMAKE_LINK_SHLIB        = $${TOOL_CHAIN}-gcc

# modifications to linux.conf
QMAKE_AR                = $${TOOL_CHAIN}-ar cqs
QMAKE_OBJCOPY           = $${TOOL_CHAIN}-objcopy
QMAKE_OBJDUMP           = $${TOOL_CHAIN}-objdump
QMAKE_STRIP             = $${TOOL_CHAIN}-strip
QMAKE_NM                = $${TOOL_CHAIN}-nm

LINKER_SCRIPT		= $${PWD}/stm32_$${MEMORY}.ld

CDEFS			+= -DUSE_STDPERIPH_DRIVER \
			  -DSTM32F4XX \
			  -DMANGUSTA_DISCOVERY \
			  -DUSE_USB_OTG_FS \
                          -DHSE_VALUE=8000000

MCUFLAGS		= -march=armv7e-m -mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb

hex.target  = hexa
hex.commands = \
               $${QMAKE_NM} $(TARGET) > $(TARGET).list && \
               $${QMAKE_OBJCOPY} -O ihex $(OBJCOPY_ARGS) $(TARGET) $(TARGET).hex && \
               $${QMAKE_OBJCOPY} -O binary $(TARGET) $(TARGET).bin && \
               printf \"set arm abi AAPCS\\ntarget remote localhost:3333\\nmonitor reset halt\\n\" > .gdbinit && \
               printf \"monitor fast_load_image $(PWD)/$(TARGET).bin 0x20000000 bin\\nmonitor fast_load\\n\" >> .gdbinit && \
               printf \"monitor reset halt\" >> .gdbinit;

hex.depends = $(TARGET)

QMAKE_EXTRA_TARGETS += hex

QMAKE_CFLAGS		= -fno-exceptions -ffunction-sections -fdata-sections \
                      $$CDEFS $$MCUFLAGS -Wall
QMAKE_LFLAGS		+= -Wl,-static,--gc-sections,-T$$LINKER_SCRIPT $$MCUFLAGS
QMAKE_CFLAGS_RELEASE	= -Os -g0
QMAKE_CFLAGS_DEBUG       = -Og -g3
QMAKE_CXXFLAGS		= $$QMAKE_CFLAGS -std=gnu++11
QMAKE_CXXFLAGS_RELEASE	= $$QMAKE_CFLAGS_RELEASE
QMAKE_CXXFLAGS_DEBUG	= $$QMAKE_CFLAGS_DEBUG


#-----------------------------------------------------------------------------
